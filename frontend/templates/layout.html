<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TravelPlan{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/base.css">
  {% block styles %}{% endblock %}
</head>
<body data-page="{% block page %}{% endblock %}">
  <nav class="topbar">
    <a class="brand" href="/">TravelPlan</a>
    <div class="spacer"></div>
    <nav class="topbar-links">
      {% if current_user %}
        {% if current_user.role == 'admin' %}
          <a class="nav-link" href="/auth/members">Members</a>
        {% endif %}
        <span class="me">{{ current_user.display_name }}</span>
        <a class="nav-link" href="/auth/logout">Logout</a>
      {% endif %}
    </nav>
  </nav>
  <main id="view">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
