<?xml version="1.0" encoding="UTF-8"?>
<!--
  TravelPlan favicon. Single SVG; scales cleanly to every size browsers ask for.

  Concept: an itinerary rendered as a journey — four connected nodes
  on a sweeping curve, the last one the "destination." This nods both
  to travel (route + destination) and to the app's core interaction
  (a plan is a sequence of days/items), which keeps it distinct from
  generic plane/globe icons. A small plane in flight along the route
  adds the travel cue without dominating the mark.

  ViewBox is 64x64. Content lives in an inset ~10px so the mark has
  breathing room at small sizes; node centers and stroke widths are
  integer or half-integer aligned for sharp rendering at 16/32/48px.

  Palette mirrors the app accent (#6366f1 to #4f46e5); white foreground
  for high contrast on the indigo field.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TravelPlan">
  <defs>
    <!-- Background gradient: top-left light, bottom-right deep -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7c7cf5"/>
      <stop offset="60%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Soft shadow under the destination node to ground it -->
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square background (app-icon shape) -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Route curve: a smooth upward sweep from lower-left to upper-right.
       Three cubic segments give a confident S; the eye travels from
       the small start node up to the emphasized destination. -->
  <path d="M 16 46
           C 20 44, 22 40, 26 38
           S 36 30, 38 28
           S 46 22, 48 18"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-opacity="0.55"/>

  <!-- Stops 1-3: small filled circles, evenly distributed. These are
       the "days" of the itinerary. -->
  <circle cx="16" cy="46" r="2.6" fill="#ffffff"/>
  <circle cx="26" cy="38" r="2.6" fill="#ffffff"/>
  <circle cx="38" cy="28" r="2.6" fill="#ffffff"/>

  <!-- Stop 4 (destination): larger, with an inner accent hole and a
       soft glow — the "where you're going." The hole lets the indigo
       background show through, echoing the route color. -->
  <circle cx="50" cy="16" r="9" fill="url(#nodeGlow)"/>
  <circle cx="50" cy="16" r="5.4" fill="#ffffff"/>
  <circle cx="50" cy="16" r="2.2" fill="#4f46e5"/>

  <!-- Plane in flight, mid-curve between stop 2 and stop 3, pointing
       along the route's tangent toward the destination. Subtle (the
       mark reads as "itinerary" first, "travel" second). -->
  <g transform="translate(32 33) rotate(-42)" opacity="0.85">
    <!-- fuselage: a long pill -->
    <rect x="-1.2" y="-0.9" width="10" height="1.8" rx="0.9" fill="#ffffff"/>
    <!-- nose -->
    <polygon points="8.8,-0.9 12,0 8.8,0.9" fill="#ffffff"/>
    <!-- wings: a slim delta, top + bottom -->
    <polygon points="2.4,-0.9 4.2,-4.2 5.6,-4.2 5.6,-0.9" fill="#ffffff"/>
    <polygon points="2.4,0.9  4.2,4.2  5.6,4.2  5.6,0.9"  fill="#ffffff"/>
  </g>
</svg>
